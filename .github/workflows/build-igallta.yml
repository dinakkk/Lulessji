name: Build FlClash Igallta (Windows)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.23'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Enable MSYS2 MinGW64 GCC in PATH
        shell: pwsh
        run: |
          echo "C:\msys64\mingw64\bin" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          gcc --version

      - name: Build Windows Client & Mihomo Core
        shell: pwsh
        run: |
          flutter config --enable-windows-desktop
          flutter pub get
          if (Test-Path "setup.dart") {
            dart run setup.dart windows --arch amd64
          } else {
            New-Item -ItemType Directory -Force -Path windows/libs
            Push-Location core
            $env:CGO_ENABLED="1"
            $env:GOOS="windows"
            $env:GOARCH="amd64"
            $env:CC="gcc"
            go build -buildmode=c-shared -ldflags="-s -w" -o ../windows/libs/libclash.dll .
            Pop-Location
            flutter build windows --release
          }

      - name: Package Release Zip
        shell: pwsh
        run: |
          $releaseDir = "build\windows\x64\runner\Release"
          if (-not (Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          Compress-Archive -Path "$releaseDir\*" -DestinationPath "FlClash-Igallta-Windows-x64.zip" -Force

      - name: Upload Windows Artifact
        uses: actions/upload-artifact@v4
        with:
          name: FlClash-Igallta-Windows-x64
          path: FlClash-Igallta-Windows-x64.zip
